name: AVUQO quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enforce versioned project register
        run: node scripts/check-project-register.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Four-brand marketing policy tests
        run: node --experimental-strip-types --test tests/marketing-policy.test.mjs tests/marketing-publishing.test.mjs tests/marketing-home-automation.test.mjs tests/navigation-v2.test.mjs tests/control-centre-workspaces.test.mjs tests/affiliate-network-readiness.test.mjs tests/awin-advertiser-onboarding.test.mjs tests/collection-planning.test.mjs tests/p0-03-collections-security.test.mjs tests/project-register.test.mjs tests/site-advertising-policy.test.mjs tests/source-rights-gate.test.mjs tests/p0-02-audit-regression.test.mjs tests/analytics-contracts.test.mjs tests/event-ingest-guard.test.mjs tests/private-product-previews.test.mjs tests/general-awin-resumable-import.test.mjs tests/awin-all-feed-matrix.test.mjs tests/general-awin-preflight-hardening.test.mjs tests/all-joined-awin-programmes.test.mjs tests/live-shopping-feed-onboarding.test.mjs tests/ebay-uk-private-pilot.test.mjs tests/live-shopping-layout-integration.test.mjs tests/private-responsive-storefront.test.mjs tests/awin-automatic-feed-monitor.test.mjs tests/tooled-up-private-catalogue-search.test.mjs tests/tooled-up-private-images-pagination.test.mjs tests/tooled-up-large-import.test.mjs tests/category-specific-product-preview.test.mjs tests/awin-feed-list-audit.test.mjs tests/awin-multi-advertiser-private-import.test.mjs tests/premium-preview-departments.test.mjs tests/category-personality.test.mjs tests/browse-tree.test.mjs tests/private-pilot-access.test.mjs tests/private-product-editorial-preview.test.mjs
      - name: eBay Sandbox, Production rights and Awin retailer onboarding tests
        run: node --experimental-strip-types --test tests/ebay-sandbox-awin-onboarding.test.mjs
      - name: Public whole-site tour and honest source status tests
        run: node --test tests/public-whole-site-tour.test.mjs
      - name: Tyres UK dormant private job journal migration safety tests
        run: node --test tests/tyres-uk-private-job-journal-migration.test.mjs
      - name: Tyres UK private worker preflight no-write security tests
        run: node --test tests/tyres-uk-worker-preflight.test.mjs
      - name: Tyres UK current snapshot candidate-only validation tests
        run: node --experimental-strip-types --test tests/tyres-uk-server-candidates.test.mjs
      - name: Tyre catalogue rendering and evidence safety tests
        run: node --experimental-strip-types --test tests/tyre-catalogue-presentation.test.mjs tests/tyre-showroom-release.test.mjs tests/tyre-comparison-contract.test.mjs tests/pneus-online-private-import.test.mjs
      - name: Marketing, tyre and 25-category product release contract tests
        run: node --experimental-strip-types --test tests/marketing-tyres-category-readiness.test.mjs
      - name: Warm-premium design, seasonal and handover safety tests
        run: node --experimental-strip-types --test tests/warm-premium-design-restoration.test.mjs
      - name: Tooled-Up Awin joined programme GBP evidence safety tests
        run: node --experimental-strip-types --test tests/tooled-up-programme-currency.test.mjs
      - name: Cadbury and Petlibro affiliate terms and permissions safety tests
        run: node --test tests/awin-cadbury-petlibro-rights-review.test.mjs
      - name: Awin numbered private feed filenames and upload error regression tests
        run: node --test tests/feed-import-filenames.test.mjs
      - name: Awin provider error redaction regression tests
        run: node --test tests/awin-http-error-redaction.test.mjs
      - name: Verify historical branch pruning frozen-commit safety gates
        run: node --test tests/verified-historical-branch-cleanup.test.mjs
      - name: Verify merged GitHub branch pruning safety gates
        run: node --test tests/verified-merged-branch-cleanup.test.mjs
      - name: Prevent generic homepage flash before UK seasonal hero
        run: node --test tests/homepage-seasonal-loading-no-flash.test.mjs
      - name: Owner homepage screenshot corrections regression tests
        run: node --test tests/owner-home-screenshot-corrections.test.mjs
      - name: Public screenshot audit workflow isolation and route contract tests
        run: node --test tests/production-visual-audit-contract.test.mjs
      - name: UK seasonal homepage calendar date boundary and source-safety tests
        run: node --test tests/uk-seasonal-home-calendar.test.mjs
      - name: Production design completion and rights-gated visual tests
        run: node --test tests/production-design-completion.test.mjs
      - name: Current cross-chat handover integrity tests
        run: node --test tests/current-handover-integrity.test.mjs
      - name: Production photographic storefront safety regression tests
        run: node --test tests/production-photographic-storefront.test.mjs
      - name: Full original live storefront restoration regression tests
        run: node --test tests/full-live-storefront-restoration.test.mjs
      - name: Live production shopping and provider pipeline regression tests
        run: node --test tests/production-shopping-journeys.test.mjs
      - name: Unified marketplace and Source Atlas safety tests
        run: node --experimental-strip-types --test tests/unified-marketplace.test.mjs
      - name: Marketing-only lint
        run: npx eslint lib/marketing components/layout/MegaNav.tsx components/home app/control-centre/marketing app/api/internal/marketing
      - run: npm run lint
      - name: Contract pricing unit tests
        run: node --experimental-strip-types --experimental-specifier-resolution=node --test lib/comparison/contract-cost.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build with non-production configuration
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          NEXT_TELEMETRY_DISABLED: '1'
