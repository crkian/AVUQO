name: AVUQO quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enforce versioned project register
        run: node scripts/check-project-register.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Awin live publisher feed-list discovery and redaction contracts
        run: node --test tests/awin-live-feed-inventory.test.mjs
      - name: Awin private per-advertiser Enhanced Feed probe safety tests
        run: node --test tests/awin-joined-private-feed-probe.test.mjs
      - name: Awin joined memberships versus per-merchant public release reconciliation
        run: node --test tests/awin-joined-launch-reconciliation.test.mjs
      - name: Four-brand marketing policy tests
        run: node --experimental-strip-types --test tests/marketing-policy.test.mjs tests/marketing-publishing.test.mjs tests/marketing-home-automation.test.mjs tests/navigation-v2.test.mjs tests/control-centre-workspaces.test.mjs tests/affiliate-network-readiness.test.mjs tests/awin-advertiser-onboarding.test.mjs tests/collection-planning.test.mjs tests/p0-03-collections-security.test.mjs tests/project-register.test.mjs tests/site-advertising-policy.test.mjs tests/source-rights-gate.test.mjs tests/p0-02-audit-regression.test.mjs tests/analytics-contracts.test.mjs tests/event-ingest-guard.test.mjs tests/private-product-previews.test.mjs tests/general-awin-resumable-import.test.mjs tests/awin-all-feed-matrix.test.mjs tests/general-awin-preflight-hardening.test.mjs tests/all-joined-awin-programmes.test.mjs tests/live-shopping-feed-onboarding.test.mjs tests/ebay-uk-private-pilot.test.mjs tests/live-shopping-layout-integration.test.mjs tests/private-responsive-storefront.test.mjs tests/awin-automatic-feed-monitor.test.mjs tests/tooled-up-private-catalogue-search.test.mjs tests/tooled-up-private-images-pagination.test.mjs tests/tooled-up-large-import.test.mjs tests/category-specific-product-preview.test.mjs tests/awin-feed-list-audit.test.mjs tests/awin-multi-advertiser-private-import.test.mjs tests/premium-preview-departments.test.mjs tests/category-personality.test.mjs tests/browse-tree.test.mjs tests/private-pilot-access.test.mjs tests/private-product-editorial-preview.test.mjs
      - name: Marketing homepage current-evidence and resumption gate tests
        run: node --experimental-strip-types --test tests/marketing-home-current-evidence.test.mjs
      - name: Editorial draft scheduler malformed-rule isolation tests
        run: node --experimental-strip-types --test tests/marketing-editorial-rule-isolation.test.mjs
      - name: eBay Sandbox, Production rights and Awin retailer onboarding tests
        run: node --experimental-strip-types --test tests/ebay-sandbox-awin-onboarding.test.mjs
      - name: eBay two-session race harness syntax and safety contracts (not a live DB test)
        run: bash -n scripts/test-ebay-tombstone-race.sh && node --test tests/ebay-two-session-race-harness.test.mjs
      - name: eBay reverse-direction advisory-lock witness syntax and safety contracts (not a live DB test)
        run: bash -n scripts/test-ebay-reverse-lock-witness.sh && node --test tests/ebay-reverse-lock-witness.test.mjs
      - name: Production-derived eBay offer FK topology and local schema-only replay contracts
        run: bash -n scripts/test-ebay-nine-only-production-schema-dump.sh && node --test tests/ebay-schema-only-production-replay.test.mjs
      - name: Exact eBay production foundation object schema gate
        run: node --test tests/ebay-foundation-objects-release-readonly.test.mjs
      - name: Seven eBay foundation function-body source hash drift contracts
        run: node --test tests/ebay-seven-foundation-body-hash.test.mjs
      - name: Four foundation live read-only structure and safe release checks
        run: node --test tests/ebay-four-foundation-exact-readonly-preflight.test.mjs
      - name: eBay production migration version collision and no-reapply contracts
        run: bash -n scripts/test-ebay-migration-history-readonly-preflight.sh && node --test tests/ebay-migration-history-readonly.test.mjs
      - name: eBay seven production FK read-only guard preflight contracts
        run: bash -n scripts/test-ebay-cascade-readonly-preflight.sh && node --test tests/ebay-cascade-readonly-preflight.test.mjs
      - name: eBay seven cascading dependency containment and rollback contracts
        run: node --test tests/ebay-cascade-containment.test.mjs
      - name: Nine-only eBay privacy migration replay after four installed equivalents
        run: bash -n scripts/test-ebay-nine-only-migration-replay.sh && node --test tests/ebay-nine-only-migration-replay.test.mjs
      - name: Real-order eBay privacy migration replay safety contracts
        run: bash -n scripts/test-ebay-ordered-migration-replay.sh && node --test tests/ebay-ordered-migration-replay.test.mjs
      - name: Read-only full-schema eBay release preflight and locked provider NO-GO
        run: node --test tests/ebay-full-schema-readonly-preflight.test.mjs
      - name: eBay actual foreign-key drift and disabled orphan guard integrity tests
        run: node --test tests/ebay-schema-drift-interlock.test.mjs
      - name: eBay DBA-only read-only execution preview contracts
        run: node --test tests/ebay-readonly-erasure-preview.test.mjs
      - name: Owner-only eBay privacy control tower fail-closed evidence tests
        run: node --experimental-strip-types --test tests/ebay-privacy-control-tower.test.mjs
      - name: eBay secondary-history lease and privacy outcome contracts
        run: node --test tests/ebay-secondary-history-lease-disposition.test.mjs
      - name: eBay exact-account secondary history evidence contracts
        run: node --test tests/ebay-secondary-account-evidence.test.mjs
      - name: eBay secondary event ownership orphaning guard tests
        run: node --test tests/ebay-secondary-reference-guard.test.mjs
      - name: DBA eBay mapped partial-erasure runner and rollback safety contracts
        run: node --test tests/ebay-dba-mapped-processor.test.mjs
      - name: eBay mapped catalogue leased executor atomic safety contracts
        run: node --test tests/ebay-leased-mapped-executor.test.mjs
      - name: Native eBay queue lease and privilege regression contracts
        run: bash -n scripts/test-ebay-native-queue-lease-race.sh && node --test tests/ebay-native-lease-race.test.mjs
      - name: Native PostgreSQL hosted runner contracts
        run: bash -n scripts/test-ebay-tombstone-race.sh scripts/test-ebay-reverse-lock-witness.sh scripts/test-ebay-committed-link-first-race.sh scripts/ebay-native-postgres-tests.sh && node --test tests/ebay-local-free-postgres.test.mjs
      - name: eBay durable erasure work journal and no-completion safety tests
        run: node --test tests/ebay-erasure-work-journal.test.mjs
      - name: eBay erasure readiness preflight read-only contract tests (not compliance proof)
        run: node --test tests/ebay-erasure-readiness-preflight.test.mjs
      - name: eBay account tombstone atomic admission database-contract tests
        run: node --test tests/ebay-atomic-tombstone-admission.test.mjs
      - name: eBay private full-store privacy inventory contract tests
        run: node --test tests/ebay-privacy-inventory.test.mjs
      - name: eBay DBA-only audited mapped erasure and no-premature-ack tests
        run: node --test tests/ebay-audited-partial-erasure.test.mjs
      - name: eBay deletion receipt permanent tombstone and no-false-completion checks
        run: node --test tests/ebay-deletion-receipt-integrity-lock.test.mjs
      - name: eBay Developer Portal challenge and fail-closed notification runtime acceptance
        run: node --test tests/ebay-portal-registration-runtime.test.mjs
      - name: eBay signed deletion runtime crypto and network-mock acceptance
        run: node --test tests/ebay-deletion-signature-runtime.test.mjs
      - name: Public eBay UK EPN partner searches without fabricated offers
        run: node --experimental-strip-types --test tests/ebay-epn-public-search.test.mjs
      - name: Saved, Watches and shared-list offer links
        run: node --test tests/deal-links.test.mjs
      - name: Fresh private Awin to held canonical pipeline, and atomic exact-draft release
        run: node --experimental-strip-types --test tests/awin-fresh-private-canonical-bridge.test.mjs
      - name: Preserve only validated own-publisher Awin deep links in fresh private rows
        run: node --experimental-strip-types --test tests/awin-private-validated-link-retention.test.mjs
      - name: Owner first live Awin offer release, withdrawal and exact evidence regression
        run: node --test tests/awin-first-live-owner-release.test.mjs
      - name: Distinct Awin SKUs must not collapse to one brand-only product key
        run: node --experimental-strip-types --test tests/awin-identity-distinct-skus.test.mjs
      - name: Exact authenticated Awin feed to draft and held canonical offers
        run: node --experimental-strip-types --test tests/awin-live-private-to-canonical.test.mjs
      - name: Owner first Awin live SKU price-and-score approval queue
        run: node --test tests/awin-first-release-owner-queue.test.mjs
      - name: Multi-advertiser public Awin identity and click-link release isolation
        run: node --experimental-strip-types --test tests/awin-multi-advertiser-public-admission.test.mjs
      - name: Accepted Awin portfolio evidence and existing owner-screen reconciliation
        run: node --experimental-strip-types --test tests/awin-accepted-portfolio-evidence.test.mjs
      - name: Petlibro accepted multi-feed strict schema and owner rotation 422 diagnostics
        run: node --experimental-strip-types --test tests/awin-petlibro-multifeed-schema.test.mjs tests/awin-portfolio-private-rotation.test.mjs
      - name: Portfolio retailer expansion, PlayPress identity and signed Google download URL security
        run: node --experimental-strip-types --test tests/awin-portfolio-expansion.test.mjs
      - name: Awin private Run Now reports exact authenticated held results without leaking feed data
        run: node --test tests/awin-owner-run-now-diagnostics.test.mjs
      - name: Recognize every accepted feed while retaining specialist tyres and private quarantine
        run: node --experimental-strip-types --test tests/awin-recognize-all-accepted-feeds.test.mjs
      - name: Automated first Awin release under recorded standing owner permission
        run: node --test tests/awin-automatic-first-release.test.mjs
      - name: Automated Awin approved merchant refresh without first-release bypass
        run: node --test tests/awin-approved-refresh-cron.test.mjs
      - name: Awin approved same-price offer renewal with first-release prohibition
        run: node --experimental-strip-types --test tests/awin-approved-offer-renewal.test.mjs
      - name: Awin automatic public stale-price and out-of-stock withdrawal contracts
        run: node --test tests/awin-public-stale-stock-withdrawal.test.mjs
      - name: Public whole-site tour and honest source status tests
        run: node --test tests/public-whole-site-tour.test.mjs
      - name: Tyres UK dormant private job journal migration safety tests
        run: node --test tests/tyres-uk-private-job-journal-migration.test.mjs
      - name: Tyres UK private worker preflight no-write security tests
        run: node --test tests/tyres-uk-worker-preflight.test.mjs
      - name: Tyres UK current snapshot candidate-only validation tests
        run: node --experimental-strip-types --test tests/tyres-uk-server-candidates.test.mjs
      - name: Tyre catalogue rendering and evidence safety tests
        run: node --experimental-strip-types --test tests/tyre-catalogue-presentation.test.mjs tests/tyre-showroom-release.test.mjs tests/tyre-comparison-contract.test.mjs tests/pneus-online-private-import.test.mjs
      - name: Marketing, tyre and 25-category product release contract tests
        run: node --experimental-strip-types --test tests/marketing-tyres-category-readiness.test.mjs
      - name: Warm-premium design, seasonal and handover safety tests
        run: node --experimental-strip-types --test tests/warm-premium-design-restoration.test.mjs
      - name: Tooled-Up Awin joined programme GBP evidence safety tests
        run: node --experimental-strip-types --test tests/tooled-up-programme-currency.test.mjs
      - name: Tooled Up daily private snapshot/validation and global-stop regression tests
        run: node --experimental-strip-types --test tests/tooled-up-daily-snapshot.test.mjs tests/tooled-up-full-stream-validator.test.mjs
      - name: Cadbury and Petlibro affiliate terms and permissions safety tests
        run: node --test tests/awin-cadbury-petlibro-rights-review.test.mjs
      - name: Awin numbered private feed filenames and upload error regression tests
        run: node --test tests/feed-import-filenames.test.mjs
      - name: Awin provider error redaction regression tests
        run: node --test tests/awin-http-error-redaction.test.mjs
      - name: Independently scheduled private Awin feeds and Vercel build filter
        run: node --test tests/awin-three-pilot-scheduler.test.mjs
      - name: Private Awin scheduled execution journaling and error redaction
        run: node --experimental-strip-types --test tests/awin-private-cron-journal.test.mjs
      - name: Cadbury exact UK GBP private staging and release-boundary regression
        run: node --experimental-strip-types --test tests/awin-cadbury-uk-gbp-private.test.mjs
      - name: Craft Buddy exact Google retail private-feed checks
        run: node --experimental-strip-types --test tests/craft-buddy-google-private-feed.test.mjs tests/awin-approved-feed-url.test.mjs
      - name: Craft Buddy private catalogue reconciliation and chronological cron safety
        run: node --test tests/craft-buddy-private-reconcile.test.mjs
      - name: Owner Petlibro preflight, private staging and global-stop acceptance tests
        run: node --test tests/awin-owner-pilot-controls.test.mjs
      - name: Petlibro private identity pairing and duplicate release safety tests
        run: node --experimental-strip-types --test tests/awin-petlibro-identity-audit.test.mjs
      - name: Petlibro automatic private candidate reconciliation and cron safety tests
        run: node --test tests/petlibro-private-reconcile.test.mjs
      - name: Mozillion private SIM-free handset draft candidate and cron tests
        run: node --test tests/mozillion-private-handset-reconcile.test.mjs
      - name: Cadbury strict private feed candidate and cron tests
        run: node --test tests/cadbury-private-candidates.test.mjs
      - name: Verify historical branch pruning frozen-commit safety gates
        run: node --test tests/verified-historical-branch-cleanup.test.mjs
      - name: Verify three reconciled closed PR branch retirement proofs
        run: node --test tests/reconciled-closed-pr-branch-retirement.test.mjs
      - name: Verify merged GitHub branch pruning safety gates
        run: node --test tests/verified-merged-branch-cleanup.test.mjs
      - name: Prevent generic homepage flash before UK seasonal hero
        run: node --test tests/homepage-seasonal-loading-no-flash.test.mjs
      - name: Owner homepage screenshot corrections regression tests
        run: node --test tests/owner-home-screenshot-corrections.test.mjs
      - name: Public screenshot audit workflow isolation and route contract tests
        run: node --test tests/production-visual-audit-contract.test.mjs
      - name: UK seasonal homepage calendar date boundary and source-safety tests
        run: node --test tests/uk-seasonal-home-calendar.test.mjs
      - name: Live Data bounded candidate streaming and no-write tests
        run: node --test tests/live-data-candidate-streaming.test.mjs
      - name: Control Centre owner audit request and read-permission regressions
        run: node --test tests/control-centre-owner-audit-regressions.test.mjs
      - name: Product detail true-404 pre-stream admission tests
        run: node --test tests/public-product-route-http-404.test.mjs
      - name: Public product research guide identity and no-price safety tests
        run: node --experimental-strip-types --test tests/public-research-product-guides.test.mjs
      - name: Production design completion and rights-gated visual tests
        run: node --test tests/production-design-completion.test.mjs
      - name: Full Git branch, source and idea handover registry tests
        run: node --test tests/complete-git-idea-handover-index.test.mjs
      - name: Current cross-chat handover integrity tests
        run: node --test tests/current-handover-integrity.test.mjs
      - name: Full source features, Git branch tracker and startup safety tests
        run: node --test tests/git-branch-source-feature-tracker.test.mjs
      - name: Owner-only current Awin private source run-now and journal tests
        run: node --test tests/awin-owner-run-now.test.mjs
      - name: Production photographic storefront safety regression tests
        run: node --test tests/production-photographic-storefront.test.mjs
      - name: Full original live storefront restoration regression tests
        run: node --test tests/full-live-storefront-restoration.test.mjs
      - name: Live production shopping and provider pipeline regression tests
        run: node --test tests/production-shopping-journeys.test.mjs
      - name: Customer shopping links and redacted Tyres UK worker diagnostics
        run: node --experimental-strip-types --test tests/navigation-shopping-paths.test.mjs tests/tyre-recheck-failure.test.mjs
      - name: Unified marketplace and Source Atlas safety tests
        run: node --experimental-strip-types --test tests/unified-marketplace.test.mjs
      - name: Integrated shopping homepage, gallery, comparison and wishlist regression
        run: node --test tests/integrated-shopping-experience.test.mjs
      - name: Retailer sales and listing description coverage regression
        run: node --experimental-strip-types --test tests/retailer-sales-listing-details.test.mjs
      - name: Marketing-only lint
        run: npx eslint lib/marketing components/layout/MegaNav.tsx components/home app/control-centre/marketing app/api/internal/marketing
      - run: npm run lint
      - name: Contract pricing unit tests
        run: node --experimental-strip-types --experimental-specifier-resolution=node --test lib/comparison/contract-cost.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build with non-production configuration
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
          NEXT_TELEMETRY_DISABLED: '1'

  ebay_postgres:
    name: Native PostgreSQL eBay concurrency (synthetic, no Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify preinstalled PostgreSQL and start local system service
        run: |
          command -v psql
          command -v createdb
          sudo systemctl start postgresql.service
          sudo -u postgres pg_isready -h /var/run/postgresql
      - name: Create disposable local-only synthetic database and run independent transaction tests
        env:
          PGHOST: /var/run/postgresql
          PGDATABASE: avuqo_ebay_ci_synthetic
        run: |
          sudo -u postgres createdb -h /var/run/postgresql avuqo_ebay_ci_synthetic
          sudo -u postgres env -u DATABASE_URL -u SUPABASE_DB_URL -u PGHOSTADDR \
            PGHOST=/var/run/postgresql PGDATABASE=avuqo_ebay_ci_synthetic \
            bash scripts/ebay-native-postgres-tests.sh
