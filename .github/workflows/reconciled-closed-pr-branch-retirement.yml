name: AVUQO reconciled closed-PR branch retirement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconciled-closed-pr-branch-retirement.yml
  workflow_dispatch:
    inputs:
      execute:
        description: "Delete only the three verified reconciled branch heads (default dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: avuqo-reconciled-closed-pr-retirement
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-check frozen closed PR refs and preserved current-main evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner,repo}=context.repo;
            const execute=context.eventName==='push'||String(context.payload.inputs?.execute)==='true';
            // These were CLOSED WITHOUT MERGE. Their substantive contribution
            // has been separately reconciled and preserved in the ledger.
            // Do not change these frozen IDs/SHAs without a fresh review.
            const candidates=[
              {
                number:50,
                name:'fix/awin-cadbury-feed-error-safety-20261104',
                expectedHead:'a5e7e7b11c0bcb93275da0374b940dc7ed24884c',
                preservedPath:'lib/connectors/awin.ts',
                preservedBlob:'b04751fd8bdc0afbcbc1e7a2120f274c81a4d910'
              },
              {
                number:51,
                name:'docs/awin-cadbury-petlibro-terms-review-20261104',
                expectedHead:'845dcee1c3b91007a02d915a36367253c9e14d5f',
                preservedPath:'docs/AWIN_CADBURY_PETLIBRO_TERMS_REVIEW_2026-11-04.md',
                preservedBlob:'711273ba18f911f437c3257fa91c697731488781'
              },
              {
                number:85,
                name:'docs/price-availability-ebay-seo-20261105',
                expectedHead:'d513679c2ac41300f934e0624b8e2285546b4245',
                preservedPath:'docs/PRICE_AVAILABILITY_EBAY_SEO_REQUIREMENTS_2026-11-05.md',
                preservedBlob:'677e9daaf46dcf791e8fc4adc389cfec23b94411'
              }
            ];
            const opened=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const allPRs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100});
            const report=[];let deleted=0,eligible=0;
            for(const item of candidates){
              const {number,name,expectedHead,preservedPath,preservedBlob}=item;
              let reason='';
              if(!name||name==='main'||name==='master'||name.startsWith('security/')||
                 name.startsWith('design/')||name.startsWith('feature/warm-premium-experience'))
                reason='protected branch family';
              if(!reason&&opened.some(pr=>pr.head.ref===name&&pr.head.repo?.full_name===`${owner}/${repo}`))
                reason='open PR references this branch';
              if(!reason&&allPRs.filter(pr=>pr.head.ref===name&&pr.head.repo?.full_name===`${owner}/${repo}`).length!==1)
                reason='reused PR branch name';
              let pr=null;
              if(!reason){
                try{
                  ({data:pr}=await github.rest.pulls.get({owner,repo,pull_number:number}));
                  if(pr.state!=='closed'||pr.merged||pr.merged_at||pr.base.ref!=='main'||
                     pr.head.repo?.full_name!==`${owner}/${repo}`||
                     pr.head.ref!==name||pr.head.sha!==expectedHead)
                    reason='closed unmerged PR identity no longer matches frozen review';
                }catch(err){reason=`PR lookup failed (${err.status}); preserve`;}
              }
              let headSha;
              if(!reason){
                try{
                  const ref=await github.rest.git.getRef({owner,repo,ref:`heads/${name}`});
                  headSha=ref.data.object.sha;
                  if(headSha!==expectedHead)reason='branch moved since review';
                }catch(err){reason=err.status===404?'already absent':`ref lookup failed (${err.status})`;}
              }
              if(!reason){
                try{
                  const commits=await github.paginate(github.rest.pulls.listCommits,{owner,repo,pull_number:number,per_page:100});
                  if(!commits.length||commits.at(-1).sha!==expectedHead)
                    reason='final PR commit does not match frozen head';
                }catch(err){reason=`reviewed commit verification unavailable (${err.status})`;}
              }
              if(!reason){
                try{
                  const file=await github.rest.repos.getContent({owner,repo,path:preservedPath,ref:'main'});
                  if(Array.isArray(file.data)||file.data.type!=='file'||file.data.sha!==preservedBlob)
                    reason='current-main preserved content changed; manual re-review required';
                  const ledger=await github.rest.repos.getContent({
                    owner,repo,path:'docs/CLOSED_LEGACY_BRANCH_RECONCILIATION_2026-11-14.md',ref:'main'
                  });
                  if(Array.isArray(ledger.data)||ledger.data.type!=='file'||
                     !Buffer.from(ledger.data.content||'','base64').toString('utf8').includes(name))
                    reason='original contribution not recorded in approved ledger';
                }catch(err){reason=`main preservation check failed (${err.status})`;}
              }
              if(!reason){
                try{
                  const info=await github.rest.repos.getBranch({owner,repo,branch:name});
                  if(info.data.protected)reason='protected GitHub branch';
                }catch(err){reason=`branch protection check failed (${err.status})`;}
              }
              if(!reason){
                eligible++;
                if(execute){
                  try{
                    // Recheck for a concurrent branch movement immediately before deletion.
                    const recheck=await github.rest.git.getRef({owner,repo,ref:`heads/${name}`});
                    if(recheck.data.object.sha!==expectedHead)reason='head changed before deletion; preserve';
                    else{
                      await github.rest.git.deleteRef({owner,repo,ref:`heads/${name}`});
                      deleted++;reason='DELETED: exact reconciled historical ref';
                    }
                  }catch(err){reason=`delete failed (${err.status}); preserve`;}
                }else reason='ELIGIBLE: dry run only';
              }
              report.push(`| #${number} | \`${name}\` | ${reason} |`);
            }
            await core.summary.addHeading('Reconciled legacy branch retirement')
              .addRaw(`Mode: ${execute?'DELETE':'DRY RUN'}, reviewed: ${candidates.length}, eligible: ${eligible}, deleted: ${deleted}.\\n\\n`)
              .addRaw('| Closed PR | Branch | Result |\\n|---|---|---|\\n'+report.join('\\n')).write();
            console.log(JSON.stringify({execute,eligible,deleted,report},null,2));
