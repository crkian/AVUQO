name: AVUQO verified merged-branch cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      execute:
        description: "Delete eligible verified merged branches (false is dry run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: avuqo-verified-merged-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune only verified merged PR branch heads since #127
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            // Ongoing cleanup after each main merge. Only branch tips that
            // match a frozen merged PR commit are eligible. The historical
            // review workflow owns PRs <=126 and preserves original assets.
            const execute = context.eventName === 'push' || String(context.payload.inputs?.execute) === 'true';
            const opened = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            const allPRs = await github.paginate(github.rest.pulls.list, {owner, repo, state:'all', per_page:100});
            const liveBranches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page:100});
            const liveNames = new Set(liveBranches.map(branch=>branch.name));
            const candidatePRs = allPRs.filter(pr=>
              pr.number>=127 && pr.merged_at && pr.base.ref==='main' &&
              pr.head?.repo?.full_name===`${owner}/${repo}` && liveNames.has(pr.head.ref)
            ).map(pr=>pr.number).sort((a,b)=>a-b);
            // Never remove a branch if it was reused for a different PR.
            const sharedNameCounts = new Map();
            for (const item of allPRs) {
              if(item.head.repo?.full_name !== `${owner}/${repo}`)continue;
              const key=item.head.ref;
              sharedNameCounts.set(key,(sharedNameCounts.get(key)||0)+1);
            }
            let deleted = 0, eligible = 0;
            const report = [];
            for (const number of candidatePRs) {
              const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:number});
              const name = pr.head.ref;
              let reason = '';
              if (!pr.merged || pr.state !== 'closed' || pr.base.ref !== 'main') reason = 'PR not merged into main';
              else if (pr.head.repo?.full_name !== `${owner}/${repo}`) reason = 'branch from other repository';
              else if (!name || name === 'main' || name === 'master' || name.startsWith('security/') || name.startsWith('design/warm-premium-visual-system') || name.startsWith('feature/warm-premium-experience')) reason = 'protected/historical reference';
              else if ((sharedNameCounts.get(name)||0)!==1) reason='branch reused across PRs; preserve';
              else if (opened.some(other => other.head.ref === name && other.head.repo?.full_name === `${owner}/${repo}`)) reason = 'branch has open PR';
              let sha;
              if (!reason) {
                try {
                  const result=await github.rest.git.getRef({owner,repo,ref:`heads/${name}`});
                  sha=result.data.object.sha;
                } catch(err) {
                  reason = err.status === 404 ? 'already deleted' : `ref lookup failed: ${err.status}`;
                }
              }
              if (!reason && sha !== pr.head.sha) reason='branch moved since merge: protect extra commits';
              // Verify the historical PR commit list, not just mutable PR head fields.
              if(!reason){
                try {
                  const commits=await github.paginate(github.rest.pulls.listCommits,{owner,repo,pull_number:number,per_page:100});
                  if(!commits.length || commits.at(-1).sha !== sha) reason='branch differs from final reviewed PR commit';
                }catch(err){reason=`PR commit verification unavailable (${err.status}); preserve`;}
              }
              if (!reason) {
                try {
                  const {data: info}=await github.rest.repos.getBranch({owner,repo,branch:name});
                  if(info.protected) reason = 'branch protected';
                }catch(err){reason=`branch protection check failed (${err.status}); preserve`;}
              }
              if (!reason) {
                eligible++;
                if (execute) {
                  try {
                    await github.rest.git.deleteRef({owner,repo,ref:`heads/${name}`});
                    deleted++;
                    reason='DELETED: exact merged PR head SHA verified';
                  } catch(err) {reason=`not deleted: GitHub ${err.status} ${err.message}`;}
                } else reason='ELIGIBLE: dry-run only';
              }
              report.push(`| #${number} | \`${name}\` | ${reason} |`);
            }
            await core.summary.addHeading('AVUQO merged branch cleanup')
              .addRaw(`Mode: ${execute?'DELETE':'DRY RUN'}. Candidates: ${candidatePRs.length}, eligible: ${eligible}, deleted: ${deleted}.\n\n`)
              .addRaw('| PR | Branch | Outcome |\n|---|---|---|\n'+report.join('\n')).write();
            console.log(JSON.stringify({execute,eligible,deleted,report},null,2));
            if(execute && deleted !== eligible)core.warning('Some eligible branches could not be deleted; see workflow summary.');
