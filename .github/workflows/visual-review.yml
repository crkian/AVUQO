name: AVUQO visual preview review
on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/lifestyle/**"
      - "lib/marketing/seasonal-calendar.ts"
      - "scripts/visual-review.mjs"
      - ".github/workflows/visual-review.yml"

permissions:
  contents: read

jobs:
  responsive-review:
    name: Capture desktop and mobile page previews
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
      NEXT_TELEMETRY_DISABLED: "1"
      VISUAL_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install app
        run: npm ci
      - name: Install screenshot runner and browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Build the preview
        run: npm run build
      - name: Start local preview
        run: |
          npm run start -- -p 3000 > visual-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat visual-server.log
          exit 1
      - name: Checkout approved design references (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: design/warm-premium-visual-system-20261105
          path: visual-design-reference
          persist-credentials: false
          sparse-checkout: |
            docs/design/mockups
          sparse-checkout-cone-mode: true
      - name: Add original reference PNGs to visual review artifact
        run: |
          mkdir -p artifacts/visual-review/reference
          cp visual-design-reference/docs/design/mockups/*.png artifacts/visual-review/reference/
          cp visual-design-reference/docs/design/mockups/ASSET_MANIFEST.json artifacts/visual-review/reference/
      - name: Capture responsive screenshots
        run: node scripts/visual-review.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avuqo-visual-review-${{ github.run_number }}
          path: |
            artifacts/visual-review/
            visual-server.log
          retention-days: 14
          if-no-files-found: warn
